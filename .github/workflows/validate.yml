name: Validate Handbook Repository

on:
  push:
    branches: [ main, release/*, v2/complete-theory-labs ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: Set up GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run Repository Validation Suite
        run: |
          python scripts/generate_foundation_gate.py
          python scripts/validate_batch1_canonical.py
          python scripts/validate_ch05_source_map.py
          python scripts/validate_ch05_content.py
          python scripts/validate_ch06_source_map.py
          python scripts/check_batch1_numeric.py
          python scripts/validate.py
          python scripts/validate_final.py
          python scripts/technical_checks.py --compile
